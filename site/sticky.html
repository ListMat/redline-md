<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      tailwind = { config: { corePlugins: { preflight: false } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter%3Awght%40100..900&family=Inter+Tight%3Awght%40100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      *, ::before, ::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }
    </style>
  </head>
  <body style="background-color: #0D0E11">
    <div
      data-pencil-name="Mobile Sticky CTA — spec"
      class="box-border w-[430px] h-fit flex flex-col gap-[14px] p-[20px] justify-start items-start bg-[#0D0E11] [outline:1px_solid_#20242A] [outline-offset:-0.5px] rounded-[14px]"
    >
      <div
        data-pencil-name="Sticky Head"
        class="box-border w-full h-fit shrink-0 flex flex-col gap-[5px] justify-start items-start"
      >
        <div
          data-pencil-name="Sticky Title"
          class="text-[10px]/[normal] box-border text-[#B7BAC0] font-[Inter,system-ui,sans-serif] font-bold tracking-[1.3px] text-left [white-space:nowrap]"
        >
          STICKY CTA BAR · MOBILE
        </div>
        <div
          data-pencil-name="Sticky Note"
          class="text-[11.5px]/[18px] box-border w-[390px] text-[#7C8087] font-[Inter,system-ui,sans-serif] font-normal text-left"
        >
          Pinned to the viewport on scroll. Appears after the hero exits — the single biggest mobile
          conversion lever.
        </div>
      </div>
      <div
        data-pencil-name="Sticky Bar"
        class="box-border w-[390px] h-fit shrink-0 [box-shadow:0px_10px_30px_#000000A6] flex flex-row gap-0 p-[10px_10px_10px_16px] justify-between items-center bg-[#101216] [outline:1px_solid_#2A2F36] [outline-offset:-0.5px] rounded-[999px]"
      >
        <div
          data-pencil-name="Sticky Left"
          class="box-border w-fit shrink-0 h-fit flex flex-col gap-[2px] justify-start items-start"
        >
          <div
            data-pencil-name="Sticky Price"
            class="text-[16px]/[normal] box-border text-[#F6F5F3] font-['Inter_Tight',system-ui,sans-serif] font-bold tracking-[-0.4px] text-left [white-space:nowrap]"
          >
            $199 flat
          </div>
          <div
            data-pencil-name="Sticky Sub"
            class="text-[10px]/[normal] box-border text-[#6B6F76] font-[Inter,system-ui,sans-serif] font-normal text-left [white-space:nowrap]"
          >
            24-hour redline
          </div>
        </div>
        <div
          data-pencil-name="Sticky Btn"
          class="box-border w-fit shrink-0 h-fit flex flex-row gap-[7px] p-[11px_16px] justify-start items-center [background-image:linear-gradient(180deg,_#F04A3B_0%,_#D62E23_100%)] bg-no-repeat bg-[length:100%_100%] rounded-[999px]"
        >
          <div
            data-pencil-name="Sticky Btn Label"
            class="text-[12.5px]/[normal] box-border text-[#FFFFFF] font-[Inter,system-ui,sans-serif] font-semibold text-left [white-space:nowrap]"
          >
            Review my contract
          </div>
          <svg
            data-pencil-name="Sticky Btn Icon"
            data-icon-name="chevron-right"
            data-icon-set="lucide"
            viewBox="0 0 13.99993896484375 14"
            preserveAspectRatio="xMidYMid meet"
            xmlns="http://www.w3.org/2000/svg"
            class="box-border w-[13px] shrink-0 h-[13px]"
          >
            <path
              d="M5.09619 2.93945q-0.25293 0.08545-0.37939 0.30762-0.04102 0.08545-0.04102 0.25293 0 0.16748 0.04102 0.25293 0.04443 0.08203 1.62353 1.66455l1.58252 1.58252-1.58252 1.58252q-1.5791 1.58252-1.62353 1.66797-0.04102 0.08203-0.04102 0.23584 0 0.15381 0.03418 0.23926 0.0376 0.08203 0.1333 0.18115 0.09912 0.0957 0.18115 0.1333 0.08545 0.03418 0.23926 0.03418 0.15381 0 0.24268-0.04785 0.09229-0.05127 1.90381-1.8628 1.81494-1.81494 1.86279-1.9038 0.05127-0.09229 0.05127-0.25977 0-0.16748-0.04443-0.24951-0.04102-0.08545-1.85938-1.90723l-1.44238-1.42871q-0.33496-0.33496-0.46143-0.41699-0.09912-0.07178-0.19824-0.07178l-0.04102 0q-0.14014 0-0.18115 0.01367z"
              fill="#FFFFFF"
            ></path>
          </svg>
        </div>
      </div>
    </div>
  </body>
</html>
